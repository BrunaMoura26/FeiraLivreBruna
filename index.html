<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema Feira Livre</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .tela { display: none; }
    .ativa { display: block; }
    .stand { display: inline-block; width: 100px; height: 100px; margin: 10px; background: lightgray; text-align: center; line-height: 100px; cursor: pointer; }
    .ocupado { background: tomato; cursor: not-allowed; }
    #stand-info { border: 1px solid #ccc; padding: 10px; margin-top: 20px; }
    .erro { color: red; font-size: 0.9em; margin-top: 4px; }
  </style>
</head>
<body>

  <!-- Tela de Login -->
  <div id="tela-login" class="tela ativa">
    <h2>Login (CPF ou CNPJ)</h2>
    <input type="text" id="documento" placeholder="Digite seu CPF ou CNPJ" /><br>
    <div id="erro-documento" class="erro"></div><br>
    <input type="password" id="senha" placeholder="Digite sua senha" /><br>
    <div id="erro-senha" class="erro"></div><br>
    <button onclick="fazerLogin()">Próximo</button>
  </div>

  <!-- Tela de Compra de Espaço -->
  <div id="tela-compra" class="tela">
    <h2>Mapa da Feira (Stands)</h2>
    <div id="mapa"></div>
    <div id="stand-info"></div>
    <button onclick="voltarLogin()">Sair</button>
    <button onclick="resetarFeira()">Resetar Feira</button>
  </div>

  <script>
    // Lista de usuários simulados na memória
    const usuarios = [
      { documento: "12345678901", senha: "Senha@123" },
      { documento: "98765432100", senha: "Teste@456" }
    ];

    // Objeto que armazena sessões ativas com tokens
    const sessoes = {};

    // Objeto com dados do usuário logado
    const usuarioLogado = { documento: null, token: null };

    // Alterna a exibição entre as telas do sistema
    function mostrarTela(id) {
      document.querySelectorAll('.tela').forEach(div => div.classList.remove('ativa'));
      document.getElementById(id).classList.add('ativa');
    }

    // Realiza o login do usuário e cria um token de sessão
    function fazerLogin() {
      const docInput = document.getElementById('documento');
      const senhaInput = document.getElementById('senha');
      const doc = docInput.value.replace(/\D/g, ''); // Remove caracteres não numéricos do documento
      const senha = senhaInput.value;

      // Elementos para exibir mensagens de erro
      const erroDocEl = document.getElementById('erro-documento');
      const erroSenhaEl = document.getElementById('erro-senha');
      erroDocEl.innerText = '';
      erroSenhaEl.innerText = '';

      // Valida quantidade de dígitos do CPF ou CNPJ
      if (!doc || (doc.length !== 11 && doc.length !== 14)) {
        erroDocEl.innerText = 'CPF deve ter 11 dígitos ou CNPJ 14 dígitos';
        return;
      }

      // Verifica se o usuário existe e se a senha está correta
      const usuario = usuarios.find(u => u.documento === doc && u.senha === senha);

      if (!usuario) {
        erroSenhaEl.innerText = 'Documento ou senha incorretos.';
        return;
      }

      // Valida a estrutura da senha com os critérios estabelecidos
      if (!validarSenha(senha)) {
        erroSenhaEl.innerText = 'Senha inválida. Requisitos: entre 8 e 12 caracteres, com pelo menos 1 maiúscula, 1 minúscula, 1 número e 1 caractere especial';
        return;
      }

      // Gera token de sessão
      const token = gerarTokenFake();             // Cria um token aleatório
      console.log("Token gerado:", token);
      sessoes[token] = doc;                        // Salva o token como chave e o documento como valor
      usuarioLogado.documento = doc;               // Salva o documento no objeto de sessão
      usuarioLogado.token = token;                 // Salva o token no objeto de sessão

      mostrarTela('tela-compra');                  // Exibe a tela de stands
      renderizarStands();                          // Renderiza os stands disponíveis
    }

    // Valida a estrutura da senha de acordo com os requisitos
    function validarSenha(senha) {
      const temMaiuscula = /[A-Z]/.test(senha);
      const temMinuscula = /[a-z]/.test(senha);
      const temNumero = /[0-9]/.test(senha);
      const temEspecial = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(senha);
      const tamanhoValido = senha.length >= 8 && senha.length <= 12;
      return temMaiuscula && temMinuscula && temNumero && temEspecial && tamanhoValido;
    }

    // Gera um token de sessão aleatório (não seguro, apenas simulação)
    function gerarTokenFake() {
      return Math.random().toString(36).substring(2) + Date.now().toString(36);
    }

    // Encerra a sessão e volta para tela de login
    function voltarLogin() {
      if (usuarioLogado.token) delete sessoes[usuarioLogado.token]; // Remove token da lista de sessões
      usuarioLogado.documento = null;
      usuarioLogado.token = null;
      document.getElementById('documento').value = '';
      document.getElementById('senha').value = '';
      document.getElementById('erro-documento').innerText = '';
      document.getElementById('erro-senha').innerText = '';
      mostrarTela('tela-login');
    }

    // Formata o campo de CPF ou CNPJ enquanto o usuário digita
    function formatarEValidarDocumento(e) {
      let input = e.target;
      let valor = input.value.replace(/\D/g, '');
      const erroDiv = document.getElementById('erro-documento');

      if (valor.length > 14) valor = valor.slice(0, 14);

      if (valor.length !== 11 && valor.length !== 14) {
        erroDiv.innerText = 'CPF deve ter 11 dígitos ou CNPJ 14 dígitos';
      } else {
        erroDiv.innerText = '';
      }

      // Aplica a máscara de CPF ou CNPJ
      if (valor.length <= 11) {
        valor = valor.replace(/^(\d{3})(\d)/, '$1.$2')
                     .replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3')
                     .replace(/^(\d{3})\.(\d{3})\.(\d{3})(\d)/, '$1.$2.$3-$4');
      } else {
        valor = valor.replace(/^(\d{2})(\d)/, '$1.$2')
                     .replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3')
                     .replace(/^(\d{2})\.(\d{3})\.(\d{3})(\d)/, '$1.$2.$3/$4')
                     .replace(/^(\d{2})\.(\d{3})\.(\d{3})\/(\d{4})(\d)/, '$1.$2.$3/$4-$5');
      }

      input.value = valor;
    }

    // Adiciona o evento de formatação ao campo de documento
    document.getElementById('documento').addEventListener('input', formatarEValidarDocumento);

    // Lista dos stands da feira
    const stands = [
      { numero: 1, tamanho: '2x2', status: 'livre', localizacao: 'Interno' },
      { numero: 2, tamanho: '3x3', status: 'livre', localizacao: 'Interno' },
      { numero: 3, tamanho: '2x2', status: 'livre', localizacao: 'Externo' },
      { numero: 4, tamanho: '3x4', status: 'livre', localizacao: 'Interno' },
      { numero: 5, tamanho: '3x3', status: 'livre', localizacao: 'Externo' },
      { numero: 6, tamanho: '2x2', status: 'livre', localizacao: 'Interno' },
      { numero: 7, tamanho: '3x3', status: 'livre', localizacao: 'Externo' },
      { numero: 8, tamanho: '2x2', status: 'livre', localizacao: 'Interno' },
      { numero: 9, tamanho: '3x4', status: 'livre', localizacao: 'Externo' },
      { numero: 10, tamanho: '5x5', status: 'livre', localizacao: 'Central (Principal)' }
    ];

    // Mostra todos os stands disponíveis na interface
    function renderizarStands() {
      const mapa = document.getElementById('mapa');
      mapa.innerHTML = '';
      stands.forEach((stand, index) => {
        const div = document.createElement('div');
        div.className = 'stand' + (stand.status === 'ocupado' ? ' ocupado' : '');
        div.innerText = `Stand ${stand.numero}`;
        if (stand.status === 'livre') {
          div.onclick = () => mostrarInfo(stand, index);
        }
        mapa.appendChild(div);
      });
    }

    // Exibe detalhes de um stand selecionado
    function mostrarInfo(stand, index) {
      const info = document.getElementById('stand-info');
      info.style.display = 'block';
      info.innerHTML = `
        <h3>Informações do Stand ${stand.numero}</h3>
        <p><strong>Tamanho:</strong> ${stand.tamanho}</p>
        <p><strong>Localização:</strong> ${stand.localizacao}</p>
        <button onclick="comprarStand(${index})">Reservar</button>
      `;
    }

    // Marca um stand como reservado, desde que o token seja válido
    function comprarStand(index) {
      if (!usuarioLogado.token || !sessoes[usuarioLogado.token]) {
        alert('Sessão expirada. Faça login novamente.');
        voltarLogin();
        return;
      }

      stands[index].status = 'ocupado'; // Marca o stand como ocupado
      alert(`Stand ${stands[index].numero} reservado para ${usuarioLogado.documento}`);
      document.getElementById('stand-info').style.display = 'none';
      renderizarStands(); // Atualiza o mapa
    }

    // Função de teste para liberar todos os stands (modo admin)
    function resetarFeira() {
      stands.forEach(stand => {
        stand.status = 'livre'; // Marca todos como livres
      });
      document.getElementById('stand-info').style.display = 'none';
      renderizarStands();
      alert('Todos os stands foram liberados!');
    }
  </script>
</body>
</html>
