<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema Feira Livre</title>
  <link rel="stylesheet" href="style.css" />

</head>
<body>

  <!-- Tela de Login -->
  <div id="tela-login" class="tela ativa">
    <h2>Login (CPF ou CNPJ)</h2>
    <input type="text" id="documento" placeholder="Digite seu CPF ou CNPJ" /><br>
    <div id="erro-documento" class="erro"></div><br>
    <input type="password" id="senha" placeholder="Digite sua senha" /><br>
    <div id="erro-senha" class="erro"></div><br>
    <button onclick="fazerLogin()">Próximo</button>
  </div>

  <!-- Tela de Compra de Espaço -->
  <div id="tela-compra" class="tela">
    <h2>Mapa da Feira (Stands)</h2>
    <div id="mapa"></div>
    <div id="stand-info"></div>
    <button onclick="voltarLogin()">Sair</button>
    <h3 style="margin-top: 40px">Mapa do Evento</h3>
    <img id="imagem-mapa" src="C:\dsv\FeiraLivreBruna/mapafeira.png" alt="Mapa ilustrado da feira com stands, corredores, entrada e saída, banheiros, praça de alimentação e estacionamento.">
  </div>

  <script src="teladelogin.js"></script>
  <script src="reservarstand.js"></script>

  </body>
</html>    
  </script>
</body>
</html>
